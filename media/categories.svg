<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262">
  <!-- outer background -->
  <rect width="560" height="262" rx="8" fill="#f6f8fa"/>

  <!-- title row -->
  <rect x="1" y="1" width="558" height="38" rx="8" fill="#0969da"/>
  <!-- clip bottom corners of title to stay sharp against header row below -->
  <rect x="1" y="20" width="558" height="19" fill="#0969da"/>
  <text x="280" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="white">README.md — Section Guide</text>

  <!-- header row -->
  <rect x="1" y="39" width="558" height="30" fill="#dce8fb"/>
  <text x="10"  y="59" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="#24292f">Section</text>
  <text x="178" y="59" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="#24292f">What to put here</text>

  <!-- row 1: General (white) -->
  <rect x="1" y="69" width="558" height="32" fill="#ffffff"/>
  <text x="10"  y="89" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0969da">General</text>
  <text x="178" y="89" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">Broad job boards, professional societies, aggregators</text>

  <!-- row 2: Contracting companies (light gray) -->
  <rect x="1" y="101" width="558" height="32" fill="#f6f8fa"/>
  <text x="22"  y="121" font-family="system-ui,sans-serif" font-size="12" fill="#0969da">&#x2514;&#x00A0;Contracting companies</text>
  <text x="178" y="121" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">Staffing and government contracting firms</text>

  <!-- row 3: Fellowships (white) -->
  <rect x="1" y="133" width="558" height="32" fill="#ffffff"/>
  <text x="10"  y="153" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0969da">Fellowships</text>
  <text x="178" y="153" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">Formal fellowship and training programs</text>

  <!-- row 4: Subfields (light gray) -->
  <rect x="1" y="165" width="558" height="32" fill="#f6f8fa"/>
  <text x="10"  y="185" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0969da">Subfields</text>
  <text x="178" y="185" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">Specialized or niche areas within bioinformatics</text>

  <!-- row 5: Regional (white) -->
  <rect x="1" y="197" width="558" height="32" fill="#ffffff"/>
  <text x="10"  y="217" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0969da">Regional</text>
  <text x="178" y="217" font-family="system-ui,sans-serif" font-size="12" fill="#24292f">Country or region-specific job boards</text>

  <!-- row 6: Country (light gray) -->
  <rect x="1" y="229" width="558" height="32" fill="#f6f8fa"/>
  <text x="22"  y="249" font-family="system-ui,sans-serif" font-size="12" fill="#0969da">&#x2514;&#x00A0;[Country]</text>
  <text x="178" y="249" font-family="system-ui,sans-serif" font-size="12" fill="#57606a">Add a new ### Country subsection under Regional</text>

  <!-- outer border -->
  <rect width="560" height="262" rx="8" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- vertical column divider -->
  <line x1="168" y1="39" x2="168" y2="261" stroke="#d0d7de" stroke-width="1"/>

  <!-- horizontal row dividers -->
  <line x1="1" y1="69"  x2="559" y2="69"  stroke="#d0d7de" stroke-width="1"/>
  <line x1="1" y1="101" x2="559" y2="101" stroke="#d0d7de" stroke-width="1"/>
  <line x1="1" y1="133" x2="559" y2="133" stroke="#d0d7de" stroke-width="1"/>
  <line x1="1" y1="165" x2="559" y2="165" stroke="#d0d7de" stroke-width="1"/>
  <line x1="1" y1="197" x2="559" y2="197" stroke="#d0d7de" stroke-width="1"/>
  <line x1="1" y1="229" x2="559" y2="229" stroke="#d0d7de" stroke-width="1"/>
</svg>
