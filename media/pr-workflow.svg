<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 88" width="760" height="88">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#57606a"/>
    </marker>
  </defs>
  <!-- background -->
  <rect width="760" height="88" rx="8" fill="#f6f8fa"/>

  <!-- box 1: Open README.md -->
  <rect x="8" y="19" width="126" height="50" rx="5" fill="#0969da"/>
  <text x="71" y="41" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle">1. Open</text>
  <text x="71" y="57" font-family="system-ui,sans-serif" font-size="11.5" fill="white" text-anchor="middle">README.md</text>
  <line x1="134" y1="44" x2="152" y2="44" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- box 2: Add entry -->
  <rect x="154" y="19" width="126" height="50" rx="5" fill="#0969da"/>
  <text x="217" y="41" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle">2. Add entry</text>
  <text x="217" y="57" font-family="system-ui,sans-serif" font-size="11.5" fill="white" text-anchor="middle">in right section</text>
  <line x1="280" y1="44" x2="298" y2="44" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- box 3: Propose changes -->
  <rect x="300" y="19" width="126" height="50" rx="5" fill="#0969da"/>
  <text x="363" y="41" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle">3. Propose</text>
  <text x="363" y="57" font-family="system-ui,sans-serif" font-size="11.5" fill="white" text-anchor="middle">changes + open PR</text>
  <line x1="426" y1="44" x2="444" y2="44" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- box 4: CI checks pass -->
  <rect x="446" y="19" width="126" height="50" rx="5" fill="#1a7f37"/>
  <text x="509" y="41" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle">4. CI checks</text>
  <text x="509" y="57" font-family="system-ui,sans-serif" font-size="11.5" fill="white" text-anchor="middle">pass</text>
  <line x1="572" y1="44" x2="590" y2="44" stroke="#57606a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- box 5: Merged -->
  <rect x="592" y="19" width="126" height="50" rx="5" fill="#8250df"/>
  <text x="655" y="41" font-family="system-ui,sans-serif" font-size="11.5" font-weight="bold" fill="white" text-anchor="middle">5. Merged!</text>
  <text x="655" y="57" font-family="system-ui,sans-serif" font-size="11.5" fill="white" text-anchor="middle">Link is live</text>
</svg>
